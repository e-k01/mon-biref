<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon brief du matin</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mon brief">
<meta name="theme-color" content="#0b0b0c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Plan : fond noir, papier journal du matin. Une colonne mobile, bandeau de jours défilable en haut, sections en cartes sobres. */
:root{
  --bg:#0b0b0c;
  --surface:#161618;
  --line:#26262a;
  --ink:#f2efe8;
  --muted:#9a968d;
  --accent:#f0b44c;
  --up:#4fc28a;
  --down:#f0675f;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 32px) max(16px, env(safe-area-inset-left));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.masthead{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.05;margin:0;text-wrap:balance}
.masthead span{color:var(--accent)}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-shrink:0}
.tabs button{all:unset;cursor:pointer;font-size:13px;font-weight:500;padding:6px 12px;border-radius:999px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
.days::-webkit-scrollbar{display:none}
.day{all:unset;cursor:pointer;scroll-snap-align:start;flex:0 0 auto;min-width:54px;text-align:center;padding:8px 6px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.day .dw{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{display:block;font-family:var(--display);font-size:22px;font-weight:600;line-height:1.1}
.day .dm{display:block;font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.day[aria-pressed="true"] .dw,.day[aria-pressed="true"] .dm,.day[aria-pressed="true"] .dn{color:#1a1206}
.dateline{font-size:13px;color:var(--muted);text-transform:capitalize}
.headline{font-family:var(--display);font-size:26px;font-weight:500;line-height:1.2;margin:4px 0 0;text-wrap:balance}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.mkt{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0;padding-top:2px}
.row .n{font-weight:600}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:15px;text-align:right}
.row .note{grid-column:1/-1;font-size:14px;color:var(--muted)}
.v.up{color:var(--up)} .v.down{color:var(--down)} .v.flat{color:var(--muted)}
.story{padding:10px 0;border-top:1px solid var(--line)}
.story:first-of-type{border-top:0;padding-top:0}
.story h3{margin:0 0 4px;font-size:16px;font-weight:600;line-height:1.35}
.story p{margin:0;font-size:15px}
.why{margin-top:6px !important;font-size:14px !important;color:var(--muted);border-left:2px solid var(--accent);padding-left:10px}
.word{background:linear-gradient(160deg,#2a2112,#161618 70%);border-color:#3a2f1a}
.word .term{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.1;color:var(--accent);margin:0}
.word p{margin:0;font-size:15px}
.word .ex{color:var(--muted);font-size:14px}
ul.plain{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
ul.plain li{position:relative;padding-left:16px;font-size:15px}
ul.plain li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.sources{font-size:12px;color:var(--muted);margin:0}
.empty{text-align:center;padding:48px 16px;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{font-family:var(--display);font-size:24px;color:var(--ink);font-weight:500}
.lex{display:flex;flex-direction:column;gap:10px}
.lex .item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.lex .item .t{font-family:var(--display);font-size:21px;font-weight:600;color:var(--accent)}
.lex .item .d{font-size:12px;color:var(--muted);margin-bottom:4px;text-transform:capitalize}
.lex .item p{margin:0;font-size:15px}
.count{font-size:13px;color:var(--muted)}
[hidden]{display:none !important}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}@keyframes f{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 class="masthead">Mon brief<br><span>du matin</span></h1>
    <div class="tabs" role="tablist">
      <button id="tab-brief" role="tab" aria-selected="true">Éditions</button>
      <button id="tab-lex" role="tab" aria-selected="false">Lexique</button>
    </div>
  </header>

  <section id="view-brief">
    <nav class="days" id="days" aria-label="Choisir un jour"></nav>
    <div id="edition"></div>
  </section>

  <section id="view-lex" hidden>
    <p class="count" id="lex-count"></p>
    <div class="lex" id="lex"></div>
  </section>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let briefs = [];
let current = null;

function parseDate(iso){ const [y,m,d] = String(iso).split("-").map(Number); return new Date(y, (m||1)-1, d||1); }
function fmtLong(iso){ return parseDate(iso).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long",year:"numeric"}); }

function showEmpty(title, text){
  $("#days").innerHTML = "";
  $("#edition").innerHTML = `<div class="empty"><strong>${esc(title)}</strong><span>${esc(text)}</span></div>`;
}

function renderDays(){
  $("#days").innerHTML = briefs.map(b => {
    const d = parseDate(b.date);
    return `<button class="day" data-id="${esc(b.date)}" aria-pressed="${b.date===current}">
      <span class="dw">${esc(d.toLocaleDateString("fr-FR",{weekday:"short"}).replace(".",""))}</span>
      <span class="dn">${d.getDate()}</span>
      <span class="dm">${esc(d.toLocaleDateString("fr-FR",{month:"short"}).replace(".",""))}</span>
    </button>`;
  }).join("");
}

function variation(v){
  const n = Number(v);
  if (v === null || v === undefined || v === "" || isNaN(n)) return {cls:"flat", txt: v ? esc(v) : "—"};
  const cls = n > 0 ? "up" : n < 0 ? "down" : "flat";
  const arrow = n > 0 ? "▲" : n < 0 ? "▼" : "■";
  return {cls, txt:`${arrow} ${n>0?"+":""}${n.toLocaleString("fr-FR",{minimumFractionDigits:1,maximumFractionDigits:2})} %`};
}

function list(items){ return `<ul class="plain">${(items||[]).map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`; }

function renderEdition(){
  const b = briefs.find(x => x.date === current);
  if (!b) return;
  const parts = [];
  parts.push(`<div class="fade" style="display:flex;flex-direction:column;gap:14px">`);
  parts.push(`<div><div class="dateline">${esc(fmtLong(b.date))}</div>${b.titre ? `<h2 class="headline">${esc(b.titre)}</h2>` : ""}</div>`);

  if (b.marches && b.marches.length){
    parts.push(`<div class="card"><h2>${b.weekend ? "La semaine sur les marchés" : "Les marchés"}</h2><div class="mkt">${
      b.marches.map(m => { const v = variation(m.variation); return `<div class="row"><span class="n">${esc(m.nom)}</span><span class="v ${v.cls}">${v.txt}</span>${m.note?`<span class="note">${esc(m.note)}</span>`:""}</div>`; }).join("")
    }</div></div>`);
  }
  if (b.recap_semaine && b.recap_semaine.length){
    parts.push(`<div class="card"><h2>Récap de la semaine</h2>${list(b.recap_semaine)}</div>`);
  }
  if (b.actus_eco && b.actus_eco.length){
    parts.push(`<div class="card"><h2>Ce qui fait bouger les marchés</h2>${
      b.actus_eco.map(a => `<div class="story"><h3>${esc(a.titre)}</h3><p>${esc(a.texte)}</p>${a.pourquoi?`<p class="why">Pourquoi c'est important : ${esc(a.pourquoi)}</p>`:""}</div>`).join("")
    }</div>`);
  }
  if (b.mot && b.mot.terme){
    parts.push(`<div class="card word"><h2>Le mot du jour</h2><p class="term">${esc(b.mot.terme)}</p><p>${esc(b.mot.definition)}</p>${b.mot.exemple?`<p class="ex">Exemple : ${esc(b.mot.exemple)}</p>`:""}</div>`);
  }
  if (b.actu && b.actu.length) parts.push(`<div class="card"><h2>Le reste de l'actu</h2>${list(b.actu)}</div>`);
  if (b.a_surveiller && b.a_surveiller.length) parts.push(`<div class="card"><h2>À surveiller aujourd'hui</h2>${list(b.a_surveiller)}</div>`);
  if (b.sources && b.sources.length) parts.push(`<p class="sources">Sources : ${b.sources.map(esc).join(" · ")}</p>`);
  parts.push(`</div>`);
  $("#edition").innerHTML = parts.join("");
}

function renderLexique(){
  const words = briefs.filter(b => b.mot && b.mot.terme);
  $("#lex-count").textContent = words.length ? `${words.length} mot${words.length>1?"s":""} appris` : "";
  $("#lex").innerHTML = words.length ? words.map(b => `<div class="item"><div class="d">${esc(fmtLong(b.date))}</div><div class="t">${esc(b.mot.terme)}</div><p>${esc(b.mot.definition)}</p></div>`).join("")
    : `<div class="empty"><strong>Pas encore de mots</strong><span>Chaque édition t'apprend un terme de finance. Ils s'ajouteront ici.</span></div>`;
}

function renderAll(){
  if (!briefs.length){ showEmpty("Ta première édition arrive bientôt", "Chaque matin vers 7h30, le brief du jour s'ajoute ici."); renderLexique(); return; }
  if (!current || !briefs.some(b => b.date === current)) current = briefs[0].date;
  renderDays(); renderEdition(); renderLexique();
}

$("#days").addEventListener("click", e => {
  const btn = e.target.closest(".day"); if (!btn) return;
  current = btn.dataset.id; renderDays(); renderEdition();
  window.scrollTo({top:0});
});

function setTab(lex){
  $("#tab-brief").setAttribute("aria-selected", String(!lex));
  $("#tab-lex").setAttribute("aria-selected", String(lex));
  $("#view-brief").hidden = lex; $("#view-lex").hidden = !lex;
  if (location.hash !== (lex ? "#lexique" : "")) history.replaceState(null, "", lex ? "#lexique" : location.pathname + location.search);
}
$("#tab-brief").addEventListener("click", () => setTab(false));
$("#tab-lex").addEventListener("click", () => setTab(true));
window.addEventListener("hashchange", () => setTab(location.hash === "#lexique"));
if (location.hash === "#lexique") setTab(true);

function _unused(snap){
  const arr = Array.isArray(snap) ? snap : (snap && (snap.docs || snap.documents)) || [];
  return arr.map(d => {
    const data = typeof d.data === "function" ? d.data() : (d.data || d);
    return Object.assign({date: d.id}, data || {});
  });
}

showEmpty("Chargement…", "Récupération de tes éditions.");
async function load(){
  try {
    const r = await fetch("data/briefs.json?t=" + Date.now(), {cache:"no-store"});
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    briefs = (Array.isArray(data) ? data : []).filter(b => b && b.date).sort((a,b) => a.date < b.date ? 1 : -1);
    renderAll();
  } catch (e) {
    if (!briefs.length) showEmpty("Connexion impossible", "Vérifie ta connexion internet puis rouvre l'appli.");
  }
}
load();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(); });
</script>
</body>
</html>
